<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Синтетическая вакансия hh.ru</title>
  </head>
  <body>
    <a data-qa="mainmenu_applicantProfile" href="/applicant/resumes">Мои резюме</a>
    <main>
      <h1 data-qa="vacancy-title">Руководитель продукта</h1>
      <button data-qa="vacancy-response-link-top" type="button">Откликнуться</button>
      <section role="dialog" id="RESPONSE_MODAL_FORM_ID" hidden>
        <button data-qa="response-popup-close" type="button">×</button>
        <label>
          <input type="radio" name="resumeId" value="synthetic-resume-1" />
          Основное резюме
        </label>
        <button data-qa="add-cover-letter" type="button">
          Добавить сопроводительное письмо
        </button>
        <label>
          Сопроводительное письмо
          <textarea data-qa="vacancy-response-popup-form-letter-input" hidden></textarea>
        </label>
        <button data-qa="vacancy-response-submit-popup" type="button">Отправить отклик</button>
      </section>
      <p data-qa="vacancy-response-success-standard-notification" data-response-id="synthetic-response-42" hidden>
        Отклик отправлен
      </p>
    </main>
    <script>
      const popup = document.querySelector('#RESPONSE_MODAL_FORM_ID');
      const textarea = document.querySelector(
        '[data-qa="vacancy-response-popup-form-letter-input"]',
      );
      document
        .querySelector('[data-qa="vacancy-response-link-top"]')
        .addEventListener('click', () => {
          window.syntheticApplyOpened = true;
          popup.hidden = false;
        });
      document
        .querySelector('[data-qa="add-cover-letter"]')
        .addEventListener('click', () => {
          textarea.hidden = false;
        });
      document
        .querySelector('[data-qa="vacancy-response-submit-popup"]')
        .addEventListener('click', () => {
          window.syntheticSubmitted = true;
          document.querySelector('[data-qa="vacancy-response-success-standard-notification"]').hidden = false;
        });
    </script>
  </body>
</html>
