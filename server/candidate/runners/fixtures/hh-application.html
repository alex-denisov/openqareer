<!doctype html>
<html lang="ru">
  <head><meta charset="utf-8"><title>Инженер — компания</title></head>
  <body>
    <a data-qa="mainmenu_applicantProfile" href="/applicant/resumes">Мои резюме</a>
    <main>
      <h1 data-qa="vacancy-title">Инженер</h1>
      <button data-qa="vacancy-response-link-top" id="open">Откликнуться</button>
      <div role="dialog" id="popup" hidden>
        <button data-qa="response-popup-close" type="button">×</button>
        <form id="RESPONSE_MODAL_FORM_ID">
        <label>
          <input type="radio" name="resumeId" value="resume-1">
          <span>Резюме кандидата</span>
        </label>
        <button data-qa="add-cover-letter" id="toggle" type="button">Добавить письмо</button>
        <textarea data-qa="vacancy-response-popup-form-letter-input" id="letter" hidden></textarea>
        </form>
        <button data-qa="vacancy-response-submit-popup" id="submit" type="button">Отправить</button>
      </div>
      <div data-qa="vacancy-response-success-standard-notification" id="success" data-response-id="response-123" hidden>Отклик отправлен</div>
    </main>
    <script>
      document.querySelector('#open').addEventListener('click', () => document.querySelector('#popup').hidden = false);
      document.querySelector('#toggle').addEventListener('click', () => document.querySelector('#letter').hidden = false);
      document.querySelector('#submit').addEventListener('click', () => {
        window.syntheticSubmitted = true;
        document.querySelector('#success').hidden = false;
      });
    </script>
  </body>
</html>
