<form name="form" novalidate>
<a class="button resume" href="#">Upload Resume</a>
<div class="section-header"><input id="resume_required" type="hidden" value="required"><div class="file-input-container type"><input id="main-attachment" name="cResume" style="display:none" type="file" required accept=".pdf, .doc"><div class="error-container" hidden><span>A resume is required</span></div><div class="form-divider"></div></div></div>
<div class="section"><div class="section-header"><h2>Personal Details</h2></div>

<h3><span>Phone Number</span></h3><input type="text" name="cPhoneNumber"><div class="form-divider"></div></div>
<div class="section"><div class="section-header"><h3><span>Cover Letter</span></h3></div><textarea name="cCoverLetter"></textarea></div>
<div class="apply-field-extra" aria-hidden="true"><label for="hp_7f2b"></label><input id="hp_7f2b" tabindex="-1" type="text" name="hp_7f2b"><input id="form_token" type="hidden" value="x"></div>
<ul><li class="question"><h3><span>Which tools do you use?</span><span class="required">*</span></h3><input required type="text" name="section_1_question_0"></li>
<li class="question"><div class="multiplechoice"><h3><span>How did you hear about us?</span></h3><ul><li><label><input type="radio" value="LinkedIn" name="section_1_question_1"><span>LinkedIn</span></label></li><li><label><input type="radio" value="Other" name="section_1_question_1"><span>Other</span></label></li></ul></div></li></ul>
<ul class="navigation-buttons"><li hidden><button class="bzyButtonColor" type="button"><span>Back</span></button></li><li hidden><button class="bzyButtonColor" type="button"><span>Continue</span></button></li><li><button class="button bzyButtonColor" type="button"><span>Submit Application</span></button></li></ul>
</form>
