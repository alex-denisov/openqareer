<oc-oneclick-form-root><oc-easy-apply><spl-dropzone><template shadowrootmode="open"><label for="file-2"><span>Choose a file</span></label><input type="file" id="file-2" accept=".pdf"></template></spl-dropzone></oc-easy-apply>
