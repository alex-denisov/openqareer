name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_OPENQAREER_RELEASE: ${{ github.sha }}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verify-{0}', github.ref) || 'openqareer-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Independent gates run side by side; the slowest one sets the wall time.
  static:
    name: Lint, types, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint and check adopted formatting baseline
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  unit:
    name: Unit tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit test shard with coverage
        env:
          COVERAGE_SHARD: '1'
        run: npx vitest run --shard=${{ matrix.shard }}/4 --coverage --reporter=blob --reporter=default

      - name: Keep shard report for the coverage merge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Coverage thresholds
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20 # прогон с покрытием подошёл к 10 мин и снимался (23.10)
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-blob-*
          path: .vitest-reports
          merge-multiple: true

      # Merges all shards and enforces the thresholds over the whole suite.
      - name: Enforce coverage thresholds
        run: npx vitest run --merge-reports --coverage

  e2e:
    name: Browser tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production artifact
        run: npm run build

      - name: Verify built shell in real Chromium
        env:
          E2E_WEBKIT: skip
        run: npx playwright test --shard=${{ matrix.shard }}/6

  e2e-webkit:
    name: Browser tests (WebKit)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # macOS ships WebKit's system libraries: no apt, no mirror to stall.
      - name: Install Playwright WebKit
        run: npx playwright install webkit

      - name: Build production artifact
        run: npm run build

      - name: WebKit specs (the .app renders in WKWebView)
        env:
          E2E_WEBKIT: only
        run: npx playwright test

  built-shell:
    name: Built shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production artifact
        run: npm run build

      - name: Verify built shell, intake fits and wizard source step
        run: |
          node scripts/verify-built-shell.mjs
          node scripts/verify-intake-fits.mjs
          node scripts/verify-wizard-source-step.mjs

  verify:
    name: Verify
    if: always()
    needs: [static, unit, coverage, e2e, e2e-webkit, built-shell]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to pass
        run: |
          printf '%s\n' '${{ toJSON(needs) }}'
          test '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}' = 'false'

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Build immutable release
        id: release
        env:
          OPENQAREER_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/health
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "openqareer-$GITHUB_SHA.tar.gz" -C dist .
          checksum="$(sha256sum "openqareer-$GITHUB_SHA.tar.gz" | awk '{print $1}')"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH host identity
        env:
          DEPLOY_KEY: ${{ secrets.OPENQAREER_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OPENQAREER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/openqareer_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/openqareer_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ vars.OPENQAREER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.OPENQAREER_DEPLOY_USER }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$HOME/.ssh/openqareer_deploy"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          scp -O "${ssh_options[@]}" "openqareer-$GITHUB_SHA.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/openqareer/incoming/$GITHUB_SHA.tar.gz"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            /usr/local/bin/openqareer-activate "$GITHUB_SHA" "$CHECKSUM"

      - name: Verify public release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            deployed="$(curl -fsS --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "https://openqareer.com/health?release=$GITHUB_SHA" 2>/dev/null || true)"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              printf 'release=%s public_health=ok attempt=%s\n' "$GITHUB_SHA" "$attempt"
              break
            fi
            if [ "$attempt" = "30" ]; then
              printf 'public health mismatch: expected %s got %s\n' "$GITHUB_SHA" "$deployed" >&2
              exit 1
            fi
            sleep 5
          done
          # Activation switches the immutable pointer atomically, but the
          # origin may need a short bounded warm-up before the entry document
          # and its compressed assets are served from the new release. Health
          # remains the readiness gate; this pause only prevents a transient
          # first-index timeout from marking an already active release failed.
          sleep 15
          # INC-018: a gate that only proves /health cannot notice a
          # half-published release. Root-level published files must come back
          # as themselves; the SPA fallback answers with text/html.
          while IFS='|' read -r root_path root_type; do
            [ -n "$root_path" ] || continue
            probe="$(mktemp)"
            # One request carries both facts; `|| true` keeps a transport
            # failure inside the diagnosis below instead of dying under
            # pipefail before the printf explains which file broke.
            response="$(curl -sS --compressed --max-time 60 --retry 3 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              -o "$probe" -w '%{http_code}|%{content_type}' \
              "https://openqareer.com${root_path}" || true)"
            bytes="$(wc -c < "$probe")"
            rm -f "$probe"
            probe_status="${response%%|*}"
            ctype="${response#*|}"
            if [ "$probe_status" = "000" ]; then
              printf 'root_file_probe=inconclusive transport_timeout path=%s\n' "$root_path"
              continue
            fi
            case "$ctype" in
              *"${root_type}"*) ;;
              *)
                printf 'root file %s answered %s (%s), expected %s\n' \
                  "$root_path" "$probe_status" "${ctype:-none}" "$root_type" >&2
                exit 1
                ;;
            esac
            if [ "$probe_status" != "200" ] || [ "$bytes" -lt 1 ]; then
              printf 'root file %s answered %s with %s bytes\n' \
                "$root_path" "$probe_status" "$bytes" >&2
              exit 1
            fi
            printf 'root_file=%s type=%s bytes=%s ok\n' "$root_path" "$root_type" "$bytes"
          done <<'ROOT_FILES'

          /favicon.svg|image/svg+xml
          /apple-touch-icon.png|image/png
          /og-cover.jpg|image/jpeg
          /robots.txt|text/plain
          /llms.txt|text/plain
          /admin.html|text/html
          ROOT_FILES
          release_index="$(mktemp)"
          curl --compressed -fsS --max-time 90 --retry 5 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://openqareer.com/?release=$GITHUB_SHA" > "$release_index"
          # The entry is the module script, not merely the first /assets/*.js in
          # the document: the head also loads a plain desktop-bootstrap script,
          # and picking that one made the release-stamp check below fail on a
          # perfectly good deployment (B148).
          # B535: the landing defers the bundle, so its path sits in the entry
          # loader's data-entry attribute instead of a module script.
          entry_asset="$(sed -nE \
            -e 's#.*<script[^>]*type="module"[^>]*src="(/assets/[^"]+\.js)".*#\1#p' \
            -e 's#.*<script[^>]*data-entry="(/assets/[^"]+\.js)".*#\1#p' \
            "$release_index" | head -n 1)"
          case "$entry_asset" in
            /assets/*.js) ;;
            *)
              printf 'production index has no safe entry asset path\n' >&2
              exit 1
              ;;
          esac
          release_asset="$(mktemp)"
          curl --compressed -fsS --max-time 60 --retry 3 --retry-all-errors \
            "https://openqareer.com$entry_asset" > "$release_asset"
          grep -Fq "$GITHUB_SHA" "$release_asset"
          # INC-026 / B168 — the public route drops any single response past
          # ~20 KB, and the render-blocking stylesheet used to be 138 KB, so
          # the site did not open at all on that route while /health stayed
          # green. No first-paint response may exceed one delivery part.
          sheet_list="$(mktemp)"
          tr '<' '\n' < "$release_index" |
            sed -nE 's#^link[^>]*rel="stylesheet"[^>]*href="(/assets/[^"]+\.css)".*#\1#p' \
            > "$sheet_list"
          sheet_count=0
          while IFS= read -r sheet_path; do
            [ -n "$sheet_path" ] || continue
            sheet_count=$((sheet_count + 1))
            # B535: measure what the route carries — browsers always ask for
            # gzip, and Caddy compresses CSS — not the decoded size curl sees
            # without Accept-Encoding.
            sheet_bytes="$(curl -fsS --max-time 30 --retry 3 --retry-all-errors \
              -H 'Accept-Encoding: gzip' -o /dev/null -w '%{size_download}' \
              "https://openqareer.com$sheet_path")"
            if [ "$sheet_bytes" -gt 12288 ]; then
              printf 'first-paint stylesheet %s is %s bytes on the wire, over one 12 KiB part\n' \
                "$sheet_path" "$sheet_bytes" >&2
              exit 1
            fi
          done < "$sheet_list"
          rm -f "$sheet_list"
          if [ "$sheet_count" -lt 1 ]; then
            printf 'production index declares no stylesheet\n' >&2
            exit 1
          fi
          printf 'first_paint_stylesheets=%s all_under_12KiB=ok\n' "$sheet_count"
          # A build asset that this release did not publish must say 404. When
          # it answered with the entry document instead, the split-bundle
          # loader read an HTML page as a bundle part and dead-ended on
          # "bad part length" (B168, and INC-018 before it).
          # The local runtime test suite proves `asset_not_found` for a missing
          # split part. The public h1 route has a known failure mode where a
          # request for a nonexistent split part can stall before headers; keep
          # that transport limitation visible without treating it as a wrong
          # HTTP response. Any response other than 404 still fails the gate.
          missing_status="$(curl -sS -I --max-time 30 --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
            "https://openqareer.com/assets/missing-$GITHUB_SHA.js" || true)"
          if [ "$missing_status" = "000" ] || [ -z "$missing_status" ]; then
            printf 'missing_asset_probe=inconclusive transport_timeout path=%s\n' \
              "/assets/missing-$GITHUB_SHA.js"
          elif [ "$missing_status" != "404" ]; then
            printf 'missing build asset answered %s, expected 404\n' \
              "$missing_status" >&2
            exit 1
          else
            printf 'missing_asset_status=404 ok\n'
          fi
          root_headers="$(mktemp)"
          if curl -sS -I --max-time 30 --retry 3 --retry-all-errors \
            https://openqareer.com/ > "$root_headers"; then
            grep -Eiq '^content-security-policy:' "$root_headers"
            grep -Eiq '^x-openqareer-origin: eu-1' "$root_headers"
            grep -Eiq '^cache-control:.*no-store' "$root_headers"
            if grep -Eiq '^(etag|last-modified):' "$root_headers"; then
              printf 'entry HTML exposes a release-agnostic cache validator\n' >&2
              exit 1
            fi
          else
            printf 'header_probe=inconclusive transport_timeout path=/\n'
          fi
          conditional_status="$(curl -sS --max-time 30 --retry 3 --retry-all-errors -o /dev/null \
            -w '%{http_code}' -H 'If-None-Match: W/"legacy-release"' \
            https://openqareer.com/ || true)"
          if [ "$conditional_status" = "000" ] || [ -z "$conditional_status" ]; then
            printf 'conditional_probe=inconclusive transport_timeout path=/\n'
          elif [ "$conditional_status" != "200" ]; then
            printf 'canonical entry accepted a stale validator: %s\n' \
              "$conditional_status" >&2
            exit 1
          else
            printf 'conditional_entry_status=200 ok\n'
          fi

      - name: Remove runner SSH material
        if: always()
        run: rm -f "$HOME/.ssh/openqareer_deploy" "$HOME/.ssh/known_hosts"
