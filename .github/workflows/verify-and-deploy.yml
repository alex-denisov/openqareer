name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_OPENQAREER_RELEASE: ${{ github.sha }}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verify-{0}', github.ref) || 'openqareer-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium for connector tests
        run: npx playwright install --with-deps chromium

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint and check adopted formatting baseline
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Enforce coverage thresholds
        run: npm run test:coverage

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build production artifact
        run: npm run build

      - name: Verify built shell in real Chromium
        run: npm run test:e2e

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Build immutable release
        id: release
        run: |
          set -euo pipefail
          npm ci
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/health
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "openqareer-$GITHUB_SHA.tar.gz" -C dist .
          checksum="$(sha256sum "openqareer-$GITHUB_SHA.tar.gz" | awk '{print $1}')"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH host identity
        env:
          DEPLOY_KEY: ${{ secrets.OPENQAREER_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OPENQAREER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/openqareer_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/openqareer_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ vars.OPENQAREER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.OPENQAREER_DEPLOY_USER }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$HOME/.ssh/openqareer_deploy"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          scp -O "${ssh_options[@]}" "openqareer-$GITHUB_SHA.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/openqareer/incoming/$GITHUB_SHA.tar.gz"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            /usr/local/bin/openqareer-activate "$GITHUB_SHA" "$CHECKSUM"

      - name: Verify public release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            deployed="$(curl -fsS --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "https://openqareer.com/health?release=$GITHUB_SHA" 2>/dev/null || true)"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              printf 'release=%s public_health=ok attempt=%s\n' "$GITHUB_SHA" "$attempt"
              break
            fi
            if [ "$attempt" = "30" ]; then
              printf 'public health mismatch: expected %s got %s\n' "$GITHUB_SHA" "$deployed" >&2
              exit 1
            fi
            sleep 5
          done
          # INC-018: a gate that only proves /health cannot notice a
          # half-published release. Root-level published files must come back
          # as themselves; the SPA fallback answers with text/html.
          while IFS='|' read -r root_path root_type; do
            [ -n "$root_path" ] || continue
            probe="$(mktemp)"
            # One request carries both facts; `|| true` keeps a transport
            # failure inside the diagnosis below instead of dying under
            # pipefail before the printf explains which file broke.
            response="$(curl -sS --compressed --max-time 60 \
              -H 'Cache-Control: no-cache' \
              -o "$probe" -w '%{http_code}|%{content_type}' \
              "https://openqareer.com${root_path}" || true)"
            bytes="$(wc -c < "$probe")"
            rm -f "$probe"
            probe_status="${response%%|*}"
            ctype="${response#*|}"
            case "$ctype" in
              *"${root_type}"*) ;;
              *)
                printf 'root file %s answered %s (%s), expected %s\n' \
                  "$root_path" "$probe_status" "${ctype:-none}" "$root_type" >&2
                exit 1
                ;;
            esac
            if [ "$probe_status" != "200" ] || [ "$bytes" -lt 1 ]; then
              printf 'root file %s answered %s with %s bytes\n' \
                "$root_path" "$probe_status" "$bytes" >&2
              exit 1
            fi
            printf 'root_file=%s type=%s bytes=%s ok\n' "$root_path" "$root_type" "$bytes"
          done <<'ROOT_FILES'

          /favicon.svg|image/svg+xml
          /apple-touch-icon.png|image/png
          /og-cover.png|image/png
          /robots.txt|text/plain
          /llms.txt|text/plain
          /admin.html|text/html
          ROOT_FILES
          release_index="$(mktemp)"
          curl --compressed -fsS --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "https://openqareer.com/?release=$GITHUB_SHA" > "$release_index"
          # The entry is the module script, not merely the first /assets/*.js in
          # the document: the head also loads a plain desktop-bootstrap script,
          # and picking that one made the release-stamp check below fail on a
          # perfectly good deployment (B148).
          entry_asset="$(sed -nE \
            's#.*<script[^>]*type="module"[^>]*src="(/assets/[^"]+\.js)".*#\1#p' \
            "$release_index" | head -n 1)"
          case "$entry_asset" in
            /assets/*.js) ;;
            *)
              printf 'production index has no safe entry asset path\n' >&2
              exit 1
              ;;
          esac
          release_asset="$(mktemp)"
          curl --compressed -fsS --max-time 60 \
            "https://openqareer.com$entry_asset" > "$release_asset"
          grep -Fq "$GITHUB_SHA" "$release_asset"
          part_prefix="$(sed -nE 's#^const PREFIX="([^"]+)";#\1#p' \
            "$release_asset" | head -n 1)"
          case "$part_prefix" in
            /assets/*.split.js.oqpart-) ;;
            *)
              printf 'production bootstrap has no safe part prefix\n' >&2
              exit 1
              ;;
          esac
          first_part="$(mktemp)"
          curl -fsS --max-time 20 \
            "https://openqareer.com${part_prefix}000.js" > "$first_part"
          first_part_bytes="$(wc -c < "$first_part")"
          if [ "$first_part_bytes" -gt 12288 ]; then
            printf 'production delivery part exceeds 12 KiB: %s\n' \
              "$first_part_bytes" >&2
            exit 1
          fi
          curl -fsSI --max-time 10 https://openqareer.com/ |
            grep -Eiq '^content-security-policy:'
          curl -fsSI --max-time 10 https://openqareer.com/ |
            grep -Eiq '^x-openqareer-origin: eu-1'
          root_headers="$(mktemp)"
          curl -fsSI --max-time 10 https://openqareer.com/ > "$root_headers"
          grep -Eiq '^cache-control:.*no-store' "$root_headers"
          if grep -Eiq '^(etag|last-modified):' "$root_headers"; then
            printf 'entry HTML exposes a release-agnostic cache validator\n' >&2
            exit 1
          fi
          conditional_status="$(curl -sS --max-time 10 -o /dev/null \
            -w '%{http_code}' -H 'If-None-Match: W/"legacy-release"' \
            https://openqareer.com/)"
          if [ "$conditional_status" != "200" ]; then
            printf 'canonical entry accepted a stale validator: %s\n' \
              "$conditional_status" >&2
            exit 1
          fi

      - name: Remove runner SSH material
        if: always()
        run: rm -f "$HOME/.ssh/openqareer_deploy" "$HOME/.ssh/known_hosts"
