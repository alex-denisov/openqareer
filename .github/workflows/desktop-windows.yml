name: Desktop app for Windows

# B576: nobody on the team runs Windows, so this runner is the only machine
# that compiles, tests and packages the Windows build. The installer is kept as
# an artifact for review; releases come from desktop-release.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'scripts/download-sing-box-sidecars.sh'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Use stable Rust
        run: rustup default stable

      - name: Install locked dependencies
        run: npm ci

      # Git Bash has curl and sha256sum; shasum (perl) and unzip may be absent,
      # so thin shims stand in for the two calls the script makes.
      - name: Download verified sing-box sidecars
        shell: bash
        run: |
          shims="$(cygpath -u "$RUNNER_TEMP")/bin"
          mkdir -p "$shims"
          command -v shasum >/dev/null || printf '#!/usr/bin/env bash\nshift 2; exec sha256sum "$@"\n' > "$shims/shasum"
          command -v unzip >/dev/null || printf '#!/usr/bin/env bash\nexec powershell -NoProfile -Command "Expand-Archive -Force -Path \\"$(cygpath -w "$2")\\" -DestinationPath \\"$(cygpath -w "$4")\\""\n' > "$shims/unzip"
          chmod +x "$shims"/* 2>/dev/null || true
          PATH="$shims:$PATH" scripts/download-sing-box-sidecars.sh

      - name: Build frontend
        env:
          VITE_OPENQAREER_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # beforeBuildCommand is a POSIX chain for the macOS build; here both of
      # its steps already ran above.
      - name: Package NSIS installer
        shell: bash
        run: npx tauri build --bundles nsis --config '{"build":{"beforeBuildCommand":""}}'

      - name: Smoke-start the installed app
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA/OpenQareer/*.exe" | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw 'installed executable not found' }
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "app exited with code $($app.ExitCode)" }
          $webview = Get-Process msedgewebview2 -ErrorAction SilentlyContinue
          if (-not $webview) { throw 'no WebView2 process: the window never rendered' }
          Write-Host "app pid $($app.Id) alive, $($webview.Count) WebView2 processes"
          Stop-Process -Id $app.Id -Force

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openqareer-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
