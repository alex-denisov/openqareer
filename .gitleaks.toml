# gitleaks — сканер секретов в рабочем дереве и во всей истории git.
#
# ЗАЧЕМ КОНФИГ. На голых правилах скан этого репозитория даёт 9 срабатываний, и
# все девять ложные: восемь — фикстуры в `*.test.ts` (там намеренно лежат
# синтетические ключи, иначе тест не проверяет разбор ключа), девятое — отпечаток
# публичного GPG-ключа Caddy в `deploy/bootstrap.sh`, то есть данные, которые
# обязаны быть публичными, иначе проверять подпись нечем.
#
# Сканер, который всегда красный, перестают читать. Список ниже гасит ровно эти
# случаи и ничего сверх них, чтобы `npm run security:history` можно было ставить
# в гейт перед коммитом — как того требует `docs/agents/security.md`.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]
entropy = 3.5

  [rules.allowlist]
  regexTarget = "secret"
  # Только две точные формы синтетических значений: UUID idempotency key и
  # строка, которой тест доказывает redaction. Путь `*.test.ts` намеренно не
  # исключается целиком — настоящий секрет в тесте должен остановить gate.
  regexes = [
    '''[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
    '''must-never-appear-in-receipt''',
  ]

[[allowlists]]
description = "Публичные значения, которые по своей природе не секрет"
regexTarget = "line"
# Отпечаток публичного GPG-ключа Caddy — проверяется при установке пакета,
# поэтому обязан быть публичным.
regexes = ['''CADDY_KEY_FINGERPRINT''']

[[allowlists]]
description = "Явные синтетические фикстуры тестов: значения-заглушки, не секреты"
paths = [
  '''server/config\.test\.ts''',
  '''server/connectors/hh/hhTestAccountEnvironment\.test\.ts''',
]
